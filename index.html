<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>Feather Browser v2</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color-scheme:dark;--bg:#0b1020;--panel:#141c30;--text:#edf2ff;--muted:#9aa9c4;--accent:#83aaff;--line:#293550;--wall:none}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);min-height:100vh}body.light{color-scheme:light;--bg:#f1f5fc;--panel:#fff;--text:#18243c;--muted:#596880;--line:#dce3ef}body.oled{--bg:#000;--panel:#101010;--line:#303030}button,input,select{font:inherit}button,select{cursor:pointer;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:11px;padding:10px}button:hover{border-color:var(--accent)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button:disabled{opacity:.35;cursor:default}header{padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:9px}.tab{display:flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;max-width:220px}.tab.active{border-color:var(--accent)}.tab button{border:0;padding:7px;background:transparent}.tab .name{min-width:90px;max-width:165px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}.bar{display:flex;align-items:center;gap:7px}.bar input,.search input{min-width:0;flex:1;padding:12px;border-radius:11px;border:1px solid var(--line);background:var(--bg);color:var(--text)}.primary{background:var(--accent);color:#091325;font-weight:700}.shell{min-height:calc(100vh - 116px);background-image:linear-gradient(135deg,transparent,rgba(60,90,160,.09)),var(--wall);background-position:center;background-size:cover}.home{max-width:900px;margin:auto;padding:clamp(35px,8vw,100px) 20px;text-align:center}.brand{font-size:clamp(36px,7vw,64px);font-weight:800;letter-spacing:-2px}.muted{color:var(--muted)}.clock{font-size:24px;font-variant-numeric:tabular-nums;margin:12px}.search{display:flex;gap:9px;max-width:650px;margin:26px auto}.links,.bookmarks{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}.section{margin:34px 0}.section h3{font-size:14px;color:var(--muted);font-weight:600}.chip{display:inline-flex;gap:3px;align-items:center}.chip button:last-child{padding:8px}.viewer{height:calc(100vh - 116px);display:flex;flex-direction:column}.notice{padding:9px 14px;background:var(--panel);display:flex;align-items:center;gap:12px;font-size:13px}.notice span{flex:1}.notice a{color:var(--accent)}iframe{flex:1;width:100%;border:0;background:#fff}.settings{position:fixed;right:16px;top:115px;z-index:3;width:min(360px,calc(100vw - 32px));max-height:calc(100vh - 135px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 20px 70px #0006}.settings h2{margin:0 0 16px}.settings label{display:block;font-size:13px;color:var(--muted);margin:14px 0 5px}.settings input,.settings select{width:100%;padding:10px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:9px}.settings input[type=color]{height:44px}.settings input[type=checkbox]{width:auto}.hidden{display:none}.hint{font-size:13px;color:var(--muted)}body.no-motion *,body.no-motion *::before,body.no-motion *::after{animation:none!important;transition:none!important}@media(max-width:650px){.bar{flex-wrap:wrap}.bar input{order:-1;flex-basis:100%}.viewer{height:calc(100vh - 170px)}.shell{min-height:calc(100vh - 170px)}.settings{top:165px}}
</style></head><body><header><div class="tabs" id="tabs" aria-label="Virtual tabs"></div><form class="bar" id="nav"><button type="button" id="back" title="Back">←</button><button type="button" id="forward" title="Forward">→</button><button type="button" id="reload" title="Reload">↻</button><button type="button" id="home" title="Home">⌂</button><input id="address" aria-label="Search or URL" placeholder="Search or enter URL" autocomplete="off"><button class="primary" type="submit">Go</button><button type="button" id="save" title="Bookmark">☆</button><button type="button" id="new" title="New virtual tab">＋</button><button type="button" id="prefs" title="Customize">⚙</button></form></header><main class="shell" id="content"></main><aside class="settings hidden" id="settings" aria-label="Feather settings"><h2>Customize Feather</h2><label for="theme">Theme</label><select id="theme"><option value="dark">Midnight</option><option value="oled">OLED black</option><option value="light">Light</option></select><label for="accent">Accent color</label><input id="accent" type="color"><label for="engine">Search engine</label><select id="engine"><option value="google">Google</option><option value="duck">DuckDuckGo</option><option value="bing">Bing</option></select><label for="wall">Wallpaper image URL (HTTPS)</label><input id="wall" placeholder="https://example.com/image.jpg"><button id="clearwall" type="button">Clear wallpaper</button><label><input id="motion" type="checkbox"> Reduce motion</label><p class="hint">Preferences and bookmarks stay in this browser's local storage. External search engines and visited sites have their own privacy policies.</p><button id="closeprefs" type="button">Close settings</button></aside><script>
'use strict';const $=id=>document.getElementById(id);const defaults={theme:'dark',accent:'#83aaff',engine:'google',wall:'',motion:false};function load(k,fallback){try{return JSON.parse(localStorage.getItem(k))??fallback}catch{return fallback}}let prefs={...defaults,...load('feather-v2-settings',{})};let bookmarks=load('feather-v03-bookmarks',[]);if(!Array.isArray(bookmarks))bookmarks=[];bookmarks=bookmarks.filter(x=>safeURL(x));let tabs=[{id:1,history:[null],pos:0}],current=1,nextId=2;const active=()=>tabs.find(t=>t.id===current),urlOf=t=>t.history[t.pos];function safeURL(s){try{let u=new URL(s);return ['http:','https:'].includes(u.protocol)?u.href:null}catch{return null}}function resolveInput(s){s=s.trim();if(!s)return null;if(/^https?:\/\//i.test(s))return safeURL(s);if(/^(localhost|[\w-]+(?:\.[\w-]+)+)(:\d+)?(\/.*)?$/i.test(s))return safeURL('https://'+s);return ({google:'https://www.google.com/search?q=',duck:'https://duckduckgo.com/?q=',bing:'https://www.bing.com/search?q='}[prefs.engine]||'https://www.google.com/search?q=')+encodeURIComponent(s)}function persist(){try{localStorage.setItem('feather-v2-settings',JSON.stringify(prefs));localStorage.setItem('feather-v03-bookmarks',JSON.stringify(bookmarks))}catch{}}function apply(){document.body.classList.toggle('light',prefs.theme==='light');document.body.classList.toggle('oled',prefs.theme==='oled');document.body.classList.toggle('no-motion',prefs.motion);document.documentElement.style.setProperty('--accent',prefs.accent);document.documentElement.style.setProperty('--wall',prefs.wall?`url("${prefs.wall.replace(/["\\]/g,'')}")`:'none');$('theme').value=prefs.theme;$('accent').value=prefs.accent;$('engine').value=prefs.engine;$('wall').value=prefs.wall;$('motion').checked=prefs.motion}function button(label,fn){const b=document.createElement('button');b.type='button';b.textContent=label;b.addEventListener('click',fn);return b}function visit(url){if(!url)return;const t=active();t.history=t.history.slice(0,t.pos+1);t.history.push(url);t.pos++;render()}function newTab(){let t={id:nextId++,history:[null],pos:0};tabs.push(t);current=t.id;render()}function closeTab(id){tabs=tabs.filter(t=>t.id!==id);if(!tabs.length){newTab();return}if(current===id)current=tabs[tabs.length-1].id;render()}function homeView(){const d=document.createElement('section');d.className='home';const brand=document.createElement('div');brand.className='brand';brand.textContent='🪶 Feather';const sub=document.createElement('p');sub.className='muted';sub.textContent='Simple. Lightweight. Yours.';const clock=document.createElement('div');clock.className='clock';clock.textContent=new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit'}).format(new Date());const f=document.createElement('form');f.className='search';const input=document.createElement('input');input.placeholder='Search the web or enter a URL';input.setAttribute('aria-label','Search');const go=button('Search',()=>{});go.type='submit';go.className='primary';f.append(input,go);f.onsubmit=e=>{e.preventDefault();visit(resolveInput(input.value))};const quick=document.createElement('div');quick.className='links';[['Wikipedia','https://www.wikipedia.org/'],['MDN','https://developer.mozilla.org/'],['GitHub','https://github.com/'],['YouTube','https://www.youtube.com/']].forEach(([n,u])=>quick.append(button(n,()=>visit(u))));const sec=document.createElement('section');sec.className='section';const h=document.createElement('h3');h.textContent='YOUR BOOKMARKS';const saved=document.createElement('div');saved.className='bookmarks';if(!bookmarks.length){const p=document.createElement('p');p.className='muted';p.textContent='Bookmark a page using ☆ to see it here.';saved.append(p)}else bookmarks.forEach(url=>{const chip=document.createElement('span');chip.className='chip';chip.append(button(new URL(url).hostname,()=>visit(url)),button('×',()=>{bookmarks=bookmarks.filter(x=>x!==url);persist();render()}));saved.append(chip)});sec.append(h,saved);const hint=document.createElement('p');hint.className='hint';hint.textContent='Some websites block embedded viewing. Use Open in Chrome when needed.';d.append(brand,sub,clock,f,quick,sec,hint);return d}function viewer(url){const d=document.createElement('div');d.className='viewer';const notice=document.createElement('div');notice.className='notice';const span=document.createElement('span');span.textContent='Embedded view · Some websites may block loading here.';const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Open in Chrome ↗';notice.append(span,a);const frame=document.createElement('iframe');frame.title='Embedded website';frame.src=url;frame.referrerPolicy='strict-origin-when-cross-origin';d.append(notice,frame);return d}function render(){const t=active(),url=urlOf(t);$('tabs').replaceChildren();tabs.forEach(item=>{const el=document.createElement('div');el.className='tab'+(item.id===current?' active':'');const sel=button(urlOf(item)?new URL(urlOf(item)).hostname:'New Tab',()=>{current=item.id;render()});sel.className='name';const x=button('×',()=>closeTab(item.id));x.title='Close tab';el.append(sel,x);$('tabs').append(el)});$('address').value=url||'';$('back').disabled=t.pos===0;$('forward').disabled=t.pos>=t.history.length-1;$('save').disabled=!url;$('save').textContent=url&&bookmarks.includes(url)?'★':'☆';$('content').replaceChildren(url?viewer(url):homeView())} $('nav').onsubmit=e=>{e.preventDefault();visit(resolveInput($('address').value))};$('back').onclick=()=>{let t=active();if(t.pos>0){t.pos--;render()}};$('forward').onclick=()=>{let t=active();if(t.pos<t.history.length-1){t.pos++;render()}};$('reload').onclick=render;$('home').onclick=()=>{let t=active();t.history=t.history.slice(0,t.pos+1);t.history.push(null);t.pos++;render()};$('new').onclick=newTab;$('save').onclick=()=>{let url=urlOf(active());if(!url)return;bookmarks=bookmarks.includes(url)?bookmarks.filter(x=>x!==url):[...bookmarks,url];persist();render()};$('prefs').onclick=()=>$('settings').classList.toggle('hidden');$('closeprefs').onclick=()=>$('settings').classList.add('hidden');['theme','accent','engine','motion','wall'].forEach(id=>$(id).addEventListener('change',()=>{let value=id==='motion'?$(id).checked:$(id).value;if(id==='wall'&&value&&!/^https:\/\//i.test(value)){alert('Please use an HTTPS image URL.');return}prefs[id]=value;persist();apply()}));$('clearwall').onclick=()=>{prefs.wall='';persist();apply()};document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('address').focus();$('address').select()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='b'){e.preventDefault();$('save').click()}});apply();render();
</script></body></html>
