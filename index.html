
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10131d">
<title>Feather Browser v3.0</title>
<style>
:root {
  --bg:#10131d;
  --panel:#191e2b;
  --panel2:#232a3b;
  --text:#eef2ff;
  --muted:#99a5bd;
  --accent:#729cff;
  --border:#354056;
}
* {box-sizing:border-box}
body {
  margin:0;
  font:14px system-ui,Segoe UI,sans-serif;
  background:var(--bg);
  color:var(--text);
}
button,input,select {font:inherit}
button {
  border:1px solid var(--border);
  background:var(--panel2);
  color:var(--text);
  border-radius:9px;
  padding:9px 12px;
  cursor:pointer;
}
button:hover {filter:brightness(1.15)}
button:focus-visible,input:focus-visible,select:focus-visible {
  outline:2px solid var(--accent);
}
input,select {
  background:var(--panel2);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:9px;
  padding:10px;
  min-width:0;
}
header {
  background:var(--panel);
  padding:10px;
  border-bottom:1px solid var(--border);
}
.tabs {
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding-bottom:9px;
}
.tab {white-space:nowrap}
.tab.active {
  background:var(--accent);
  color:#09101f;
}
.toolbar {
  display:flex;
  align-items:center;
  gap:7px;
}
#address {flex:1}
main {min-height:calc(100vh - 110px)}
#home {
  min-height:calc(100vh - 115px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background-position:center;
  background-size:cover;
}
.home-inner {
  width:100%;
  max-width:680px;
  text-align:center;
  padding:30px;
  border-radius:24px;
  background:color-mix(in srgb,var(--bg) 85%,transparent);
  backdrop-filter:blur(15px);
}
.logo {
  font-size:clamp(36px,7vw,64px);
  font-weight:750;
  letter-spacing:-2px;
}
.logo span {color:var(--accent)}
.subtitle {color:var(--muted)}
.search {
  display:flex;
  gap:8px;
  margin:25px 0;
}
.search input {flex:1}
.shortcuts {
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px;
}
.shortcut {padding:14px 18px}
#clock {
  font-size:28px;
  font-weight:600;
  margin:20px;
}
#viewer {display:none;height:calc(100vh - 115px)}
#frame {
  width:100%;
  height:100%;
  border:0;
  background:white;
}
#status {
  color:var(--muted);
  padding:9px;
  font-size:12px;
  text-align:center;
}
dialog {
  background:var(--panel);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:16px;
  width:min(92vw,520px);
  max-height:85vh;
  overflow:auto;
}
dialog::backdrop {background:#000a}
.setting {margin:15px 0}
.setting label {
  display:block;
  margin-bottom:7px;
  color:var(--muted);
}
.setting input,.setting select {width:100%}
.actions {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.bookmark-row {
  display:flex;
  gap:8px;
  align-items:center;
  margin:8px 0;
}
.bookmark-row button:first-child {
  flex:1;
  overflow:hidden;
  text-overflow:ellipsis;
}
@media(max-width:600px) {
  .toolbar {flex-wrap:wrap}
  #address {flex-basis:100%;order:-1}
  .home-inner {padding:18px}
}
@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    animation:none!important;
    transition:none!important;
  }
}
</style>
</head>
<body>

<header>
  <div class="tabs" id="tabs"></div>
  <div class="toolbar">
    <button id="back" title="Back">←</button>
    <button id="forward" title="Forward">→</button>
    <button id="reload" title="Reload">↻</button>
    <button id="homeBtn" title="Home">⌂</button>
    <input id="address" aria-label="Address or search" placeholder="Search or enter URL">
    <button id="go">Go</button>
    <button id="bookmarkBtn" title="Bookmark">☆</button>
    <button id="bookmarksBtn">Bookmarks</button>
    <button id="settingsBtn">⚙</button>
  </div>
</header>

<main>
  <section id="home">
    <div class="home-inner">
      <div class="logo">Feather<span>.</span></div>
      <p class="subtitle">Your web. Your experience.</p>
      <div id="clock"></div>
      <div class="search">
        <input id="homeSearch" placeholder="Search the web...">
        <button id="homeGo">Search</button>
      </div>
      <div class="shortcuts" id="shortcuts"></div>
      <p class="subtitle">Fast • Customizable • Private by design</p>
    </div>
  </section>
  <section id="viewer">
    <iframe id="frame" sandbox=""
      referrerpolicy="no-referrer"
      title="Feather website preview"></iframe>
  </section>
</main>
<div id="status">Feather Browser v3.0</div>

<dialog id="settings">
  <h2>⚙ Feather Settings</h2>
  <div class="setting">
    <label for="backend">Proxy backend URL</label>
    <input id="backend" placeholder="https://your-service.onrender.com">
  </div>
  <div class="setting">
    <label for="engine">Search engine</label>
    <select id="engine">
      <option value="google">Google</option>
      <option value="duck">DuckDuckGo</option>
      <option value="bing">Bing</option>
    </select>
  </div>
  <div class="setting">
    <label for="theme">Theme</label>
    <select id="theme">
      <option value="dark">Midnight</option>
      <option value="oled">OLED Black</option>
      <option value="light">Light</option>
    </select>
  </div>
  <div class="setting">
    <label for="accent">Accent color</label>
    <input type="color" id="accent" value="#729cff">
  </div>
  <div class="setting">
    <label for="wallpaper">Wallpaper image URL (HTTPS)</label>
    <input id="wallpaper" placeholder="https://example.com/wallpaper.jpg">
  </div>
  <div class="setting">
    <label>
      <input type="checkbox" id="proxyEnabled" style="width:auto">
      Use read-only proxy preview
    </label>
  </div>
  <div class="actions">
    <button id="saveSettings">Save settings</button>
    <button id="closeSettings">Close</button>
  </div>
  <p class="subtitle">
    Proxy previews support approved public HTML pages.
    Logins, forms and interactive scripts are not supported.
  </p>
</dialog>

<dialog id="bookmarkDialog">
  <h2>☆ Bookmarks</h2>
  <div id="bookmarkList"></div>
  <button id="closeBookmarks">Close</button>
</dialog>

<script>
"use strict";

const $ = id => document.getElementById(id);
const KEY = "feather_v3_preferences";

const defaults = {
  backend:"",
  engine:"google",
  theme:"dark",
  accent:"#729cff",
  wallpaper:"",
  proxyEnabled:false,
  bookmarks:[],
  shortcuts:[
    {name:"Google",url:"https://www.google.com"},
    {name:"YouTube",url:"https://www.youtube.com"},
    {name:"Wikipedia",url:"https://en.wikipedia.org"},
    {name:"GitHub",url:"https://github.com"}
  ]
};

let saved = {};
try {saved = JSON.parse(localStorage.getItem(KEY)) || {}}
catch {saved = {}}
let prefs = {...defaults,...saved};
if (!Array.isArray(prefs.bookmarks)) prefs.bookmarks = [];
if (!Array.isArray(prefs.shortcuts)) prefs.shortcuts = defaults.shortcuts;

function save() {
  localStorage.setItem(KEY,JSON.stringify(prefs));
}

let tabs = [{history:[""],index:0}];
let active = 0;
let requestID = 0;

function current() {return tabs[active]}
function currentURL() {
  return current().history[current().index];
}

function setStatus(message) {$("status").textContent=message}

function searchURL(query) {
  const engines = {
    google:"https://www.google.com/search?q=",
    duck:"https://duckduckgo.com/?q=",
    bing:"https://www.bing.com/search?q="
  };
  return (engines[prefs.engine] || engines.google)
    + encodeURIComponent(query);
}

function normalize(input) {
  input = input.trim();
  if (!input) return "";
  if (/^https?:\/\//i.test(input)) {
    try {
      const u = new URL(input);
      return u.protocol === "https:" ? u.href : searchURL(input);
    } catch {return searchURL(input)}
  }
  if (/^[a-z0-9-]+(\.[a-z0-9-]+)+([/:?#].*)?$/i.test(input)) {
    try {return new URL("https://"+input).href}
    catch {}
  }
  return searchURL(input);
}

function navigate(input) {
  const url = normalize(input);
  if (!url) return;
  const tab = current();
  tab.history = tab.history.slice(0,tab.index+1);
  tab.history.push(url);
  tab.index++;
  render();
}

function renderTabs() {
  const area = $("tabs");
  area.replaceChildren();
  tabs.forEach((tab,i)=>{
    const button=document.createElement("button");
    button.className="tab"+(i===active?" active":"");
    let title="New Tab";
    const url=tab.history[tab.index];
    if(url) {
      try {title=new URL(url).hostname}
      catch {title="Page"}
    }
    button.textContent=title+"  ×";
    button.onclick=()=>{
      if(i===active && tabs.length>1) {
        tabs.splice(i,1);
        active=Math.min(i,tabs.length-1);
      } else {
        active=i;
      }
      render();
    };
    area.append(button);
  });
  const add=document.createElement("button");
  add.textContent="+";
  add.title="New tab";
  add.onclick=()=>{
    tabs.push({history:[""],index:0});
    active=tabs.length-1;
    render();
  };
  area.append(add);
}

function showHome() {
  $("home").style.display="flex";
  $("viewer").style.display="none";
  $("frame").removeAttribute("srcdoc");
  $("address").value="";
  setStatus("Feather Browser v3.0 — Ready");
}

async function showPage(url) {
  $("home").style.display="none";
  $("viewer").style.display="block";
  $("address").value=url;
  const frame=$("frame");
  frame.srcdoc="<p style='font-family:sans-serif;padding:25px'>Loading preview...</p>";
  const id=++requestID;

  if(!prefs.proxyEnabled || !prefs.backend) {
    frame.srcdoc="<p style='font-family:sans-serif;padding:25px'>Proxy preview is disabled. Enable it in Feather Settings.</p>";
    setStatus("Proxy preview disabled");
    return;
  }

  try {
    const base=new URL(prefs.backend);
    if(base.protocol!=="https:") throw Error("Backend must use HTTPS");
    const endpoint=new URL("/proxy",base);
    endpoint.searchParams.set("url",url);
    setStatus("Loading "+url);

    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(),12000);
    let response;
    try {
      response=await fetch(endpoint,{
        signal:controller.signal,
        credentials:"omit"
      });
    } finally {clearTimeout(timeout)}

    const html=await response.text();
    if(id!==requestID) return;

    if(!response.ok) {
      let message="Preview unavailable";
      try {message=JSON.parse(html).error||message}
      catch {}
      throw Error(message);
    }

    // Sandboxed document: no scripts, forms or same-origin privileges.
    frame.srcdoc=html;
    setStatus("Read-only preview: "+url);
  } catch(error) {
    if(id!==requestID) return;
    frame.srcdoc="";
    const message=document.createElement("p");
    message.style.cssText="font-family:sans-serif;padding:25px";
    message.textContent="Cannot preview this page: "+error.message;
    const doc="<!doctype html><html><body>"+message.outerHTML+"</body></html>";
    frame.srcdoc=doc.replace(/&/g,"&amp;").replace(/&amp;lt;/g,"&lt;");
    setStatus("Preview failed");
  }
}

function render() {
  ++requestID;
  renderTabs();
  const url=currentURL();
  if(!url) showHome();
  else showPage(url);
}

$("go").onclick=()=>navigate($("address").value);
$("address").onkeydown=e=>{
  if(e.key==="Enter") navigate(e.target.value);
};
$("homeGo").onclick=()=>navigate($("homeSearch").value);
$("homeSearch").onkeydown=e=>{
  if(e.key==="Enter") navigate(e.target.value);
};
$("homeBtn").onclick=()=>{
  const tab=current();
  tab.history=tab.history.slice(0,tab.index+1);
  tab.history.push("");
  tab.index++;
  render();
};
$("back").onclick=()=>{
  if(current().index>0) {current().index--;render()}
};
$("forward").onclick=()=>{
  if(current().index<current().history.length-1) {
    current().index++;
    render();
  }
};
$("reload").onclick=render;

function renderShortcuts() {
  const area=$("shortcuts");
  area.replaceChildren();
  prefs.shortcuts.forEach(item=>{
    const button=document.createElement("button");
    button.className="shortcut";
    button.textContent=item.name;
    button.onclick=()=>navigate(item.url);
    area.append(button);
  });
}

$("bookmarkBtn").onclick=()=>{
  const url=currentURL();
  if(!url) return;
  if(!prefs.bookmarks.some(b=>b.url===url)) {
    prefs.bookmarks.push({url,name:new URL(url).hostname});
    save();
    setStatus("Bookmark saved");
  } else setStatus("Already bookmarked");
};

function renderBookmarks() {
  const area=$("bookmarkList");
  area.replaceChildren();
  if(!prefs.bookmarks.length) area.textContent="No bookmarks yet.";
  prefs.bookmarks.forEach((b,i)=>{
    const row=document.createElement("div");
    row.className="bookmark-row";
    const open=document.createElement("button");
    open.textContent=b.name;
    open.onclick=()=>{
      $("bookmarkDialog").close();
      navigate(b.url);
    };
    const remove=document.createElement("button");
    remove.textContent="Remove";
    remove.onclick=()=>{
      prefs.bookmarks.splice(i,1);
      save();
      renderBookmarks();
    };
    row.append(open,remove);
    area.append(row);
  });
}

$("bookmarksBtn").onclick=()=>{
  renderBookmarks();
  $("bookmarkDialog").showModal();
};
$("closeBookmarks").onclick=()=>$("bookmarkDialog").close();

function applyTheme() {
  const themes={
    dark:["#10131d","#191e2b","#232a3b","#eef2ff","#99a5bd","#354056"],
    oled:["#000000","#0b0b0b","#171717","#ffffff","#aaaaaa","#333333"],
    light:["#f3f6fc","#ffffff","#e5ebf5","#152033","#56647a","#ccd5e4"]
  };
  const values=themes[prefs.theme]||themes.dark;
  const keys=["--bg","--panel","--panel2","--text","--muted","--border"];
  keys.forEach((key,i)=>document.documentElement.style.setProperty(key,values[i]));
  document.documentElement.style.setProperty("--accent",prefs.accent);

  let wallpaper="";
  try {
    const u=new URL(prefs.wallpaper);
    if(u.protocol==="https:") wallpaper='url("'+u.href.replace(/["\\]/g,"")+'")';
  } catch {}
  $("home").style.backgroundImage=wallpaper;
}

$("settingsBtn").onclick=()=>{
  $("backend").value=prefs.backend;
  $("engine").value=prefs.engine;
  $("theme").value=prefs.theme;
  $("accent").value=prefs.accent;
  $("wallpaper").value=prefs.wallpaper;
  $("proxyEnabled").checked=prefs.proxyEnabled;
  $("settings").showModal();
};
$("closeSettings").onclick=()=>$("settings").close();
$("saveSettings").onclick=()=>{
  prefs.backend=$("backend").value.trim().replace(/\/+$/,"");
  prefs.engine=$("engine").value;
  prefs.theme=$("theme").value;
  prefs.accent=$("accent").value;
  prefs.wallpaper=$("wallpaper").value.trim();
  prefs.proxyEnabled=$("proxyEnabled").checked;
  save();
  applyTheme();
  $("settings").close();
  render();
};

function updateClock() {
  $("clock").textContent=new Date().toLocaleTimeString([],{
    hour:"numeric",minute:"2-digit"
  });
}
updateClock();
setInterval(()=>{
  if(document.visibilityState==="visible") updateClock();
},30000);

document.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="l") {
    e.preventDefault();
    $("address").focus();
    $("address").select();
  }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k") {
    e.preventDefault();
    $("homeSearch").focus();
  }
});

renderShortcuts();
applyTheme();
render();
</script>
</body>
</html>
