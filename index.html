<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10131b"><title>Feather Browser</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#10131b;color:#f0f3fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;flex-direction:column}header{display:flex;justify-content:space-between;align-items:center;padding:22px 6vw;border-bottom:1px solid #282e3b}.brand{font-weight:750;letter-spacing:.3px;font-size:1.1rem}.brand span{color:#8bc4ff}main{width:min(700px,90vw);margin:12vh auto 0;text-align:center}h1{font-size:clamp(2rem,6vw,3.5rem);margin:0 0 12px}p{color:#aeb8c9}form{display:flex;background:#202635;border:1px solid #394354;border-radius:16px;margin:36px 0 26px;overflow:hidden}input{background:transparent;border:0;color:white;outline:0;flex:1;padding:19px;font-size:1rem;min-width:0}button{background:#83b9f8;color:#101722;border:0;padding:0 24px;font-weight:700;cursor:pointer}button:hover{background:#a8d0ff}.links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.links a{background:#202635;border:1px solid #343d4e;padding:13px 17px;border-radius:12px;color:#e5ecf8;text-decoration:none}.links a:hover{border-color:#83b9f8}footer{margin-top:auto;text-align:center;padding:25px;color:#8f9aab;font-size:.8rem}#clock{color:#aab6c9;font-variant-numeric:tabular-nums}@media(max-width:420px){form button{padding:0 14px}}
</style></head><body><header><div class="brand">🪶 Feather <span>Browser</span></div><div id="clock" aria-label="Current time"></div></header><main><h1>Browse lighter.</h1><p>A simple start page without unnecessary clutter.</p><form id="search"><input id="query" aria-label="Search the web" placeholder="Search the web…" required autocomplete="off"><button type="submit">Search</button></form><div class="links"><a href="https://www.wikipedia.org/">Wikipedia</a><a href="https://www.google.com/">Google</a><a href="https://www.khanacademy.org/">Khan Academy</a></div><p style="font-size:.82rem;margin-top:34px">Sites open in Chrome and remain subject to your device's policies.</p></main><footer>Feather v0.2 · No tracking · No external scripts</footer><script>
const clock=document.getElementById('clock');function updateClock(){clock.textContent=new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit'}).format(new Date())}updateClock();setInterval(updateClock,30000);document.getElementById('search').addEventListener('submit',e=>{e.preventDefault();const q=document.getElementById('query').value.trim();if(q)location.href='https://www.google.com/search?q='+encodeURIComponent(q)});
</script></body></html>
