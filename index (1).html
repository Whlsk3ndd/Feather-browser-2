<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10131a"><title>Feather Browser</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#10131a;color:#eef2ff}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;color:inherit;background:#252b38;border:1px solid #3b4557;border-radius:9px;padding:9px 12px}button:hover{background:#354056}button:focus-visible,input:focus-visible{outline:2px solid #81aaff;outline-offset:2px}.top{background:#181d28;border-bottom:1px solid #333d4e;padding:9px;display:grid;gap:9px}.tabs{display:flex;gap:5px;overflow-x:auto}.tab{display:flex;align-items:center;gap:8px;min-width:130px;max-width:220px;background:#202838;padding:5px 8px;border-radius:10px 10px 3px 3px}.tab.active{background:#394862}.tab button{padding:3px 7px;background:transparent;border:0}.tab .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;font-size:13px}.bar{display:flex;gap:7px;align-items:center}.bar input{min-width:0;flex:1;border-radius:10px;padding:11px 13px;border:1px solid #4a556a;background:#10151f;color:white}.bar button{white-space:nowrap}.content{min-height:calc(100vh - 120px)}.home{max-width:800px;margin:0 auto;padding:clamp(28px,8vw,85px) 18px;text-align:center}.brand{font-size:clamp(30px,6vw,52px);font-weight:750;letter-spacing:-1.5px}.muted{color:#a5afc2}.search{display:flex;gap:8px;margin:25px auto;max-width:600px}.search input{flex:1;min-width:0;background:#1b2330;border:1px solid #526077;border-radius:12px;padding:15px;color:white}.search button{background:#729cf4;color:#0c1527;font-weight:700}.links{display:flex;justify-content:center;flex-wrap:wrap;gap:10px}.links button{padding:12px 16px}.hint{font-size:13px;color:#a5afc2;margin-top:25px}.viewer{height:calc(100vh - 123px);min-height:400px;display:flex;flex-direction:column}.viewer iframe{flex:1;width:100%;border:0;background:white}.notice{background:#222d41;padding:8px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}.notice span{flex:1}.notice a{color:#9fc0ff}.bookmarks{margin-top:35px}.bookmarks button{margin:4px}.small{font-size:12px}.hidden{display:none}@media(max-width:550px){.bar{flex-wrap:wrap}.bar input{flex-basis:100%;order:-1}.viewer{height:calc(100vh - 180px)}}
</style></head><body>
<header class="top"><div class="tabs" id="tabs" aria-label="Tabs"></div><form class="bar" id="nav"><button type="button" id="back" title="Back">←</button><button type="button" id="forward" title="Forward">→</button><button type="button" id="reload" title="Reload">↻</button><button type="button" id="home" title="Home">⌂</button><input id="address" aria-label="Search or enter website address" placeholder="Search or enter a website URL" autocomplete="off"><button type="submit">Go</button><button type="button" id="save" title="Bookmark this page">☆</button><button type="button" id="new" title="New tab">＋</button></form></header>
<main id="content" class="content"></main>
<script>
'use strict';
const $=id=>document.getElementById(id), searchBase='https://www.google.com/search?q=';
const safeURL=s=>{try{const u=new URL(s);return ['https:','http:'].includes(u.protocol)?u.href:null}catch{return null}};
function resolveInput(input){const s=input.trim();if(!s)return null;if(/^https?:\/\//i.test(s))return safeURL(s);if(/^(localhost|[\w-]+(?:\.[\w-]+)+)(:\d+)?(\/.*)?$/i.test(s))return safeURL('https://'+s);return searchBase+encodeURIComponent(s)}
const storageKey='feather-v03-bookmarks';let bookmarks=[];try{bookmarks=JSON.parse(localStorage.getItem(storageKey)||'[]');if(!Array.isArray(bookmarks))bookmarks=[]}catch{bookmarks=[]}
let tabs=[{id:1,history:[null],pos:0}],current=1,nextId=2;
const active=()=>tabs.find(t=>t.id===current),urlOf=t=>t.history[t.pos];
function visit(url){if(!url)return;const t=active();t.history=t.history.slice(0,t.pos+1);t.history.push(url);t.pos++;render()}
function newTab(){const t={id:nextId++,history:[null],pos:0};tabs.push(t);current=t.id;render()}
function closeTab(id){tabs=tabs.filter(t=>t.id!==id);if(!tabs.length){newTab();return}if(current===id)current=tabs[tabs.length-1].id;render()}
function button(label,handler){const b=document.createElement('button');b.textContent=label;b.addEventListener('click',handler);return b}
function homeView(){const div=document.createElement('section');div.className='home';const h=document.createElement('div');h.className='brand';h.textContent='🪶 Feather';const p=document.createElement('p');p.className='muted';p.textContent='Simple. Lightweight. Yours.';const form=document.createElement('form');form.className='search';const input=document.createElement('input');input.placeholder='Search the web';input.setAttribute('aria-label','Search the web');const go=button('Search',()=>{});go.type='submit';form.append(input,go);form.addEventListener('submit',e=>{e.preventDefault();visit(resolveInput(input.value))});const links=document.createElement('div');links.className='links';[['Wikipedia','https://www.wikipedia.org/'],['MDN Web Docs','https://developer.mozilla.org/'],['Example','https://example.com/']].forEach(([name,url])=>links.append(button(name,()=>visit(url))));const hint=document.createElement('p');hint.className='hint';hint.textContent='Some websites block embedded viewing. Use “Open in Chrome” when needed. School website policies still apply.';const saved=document.createElement('div');saved.className='bookmarks';const title=document.createElement('h3');title.textContent='Bookmarks';saved.append(title);if(!bookmarks.length){const empty=document.createElement('p');empty.className='muted small';empty.textContent='Save a page with ☆ to see it here.';saved.append(empty)}else bookmarks.forEach(url=>{const wrapper=document.createElement('span');wrapper.append(button(new URL(url).hostname,()=>visit(url)),button('×',()=>{bookmarks=bookmarks.filter(x=>x!==url);persist();render()}));saved.append(wrapper)});div.append(h,p,form,links,hint,saved);return div}
function persist(){try{localStorage.setItem(storageKey,JSON.stringify(bookmarks))}catch{}}
function viewer(url){const div=document.createElement('div');div.className='viewer';const notice=document.createElement('div');notice.className='notice';const span=document.createElement('span');span.textContent='Embedded view • Some sites may refuse to load here.';const link=document.createElement('a');link.textContent='Open in Chrome ↗';link.href=url;link.target='_blank';link.rel='noopener noreferrer';notice.append(span,link);const iframe=document.createElement('iframe');iframe.title='Embedded webpage';iframe.src=url;iframe.referrerPolicy='strict-origin-when-cross-origin';div.append(notice,iframe);return div}
function render(){const t=active(),url=urlOf(t);$('tabs').replaceChildren();tabs.forEach(item=>{const tab=document.createElement('div');tab.className='tab'+(item.id===current?' active':'');const select=button(urlOf(item)?new URL(urlOf(item)).hostname:'New Tab',()=>{current=item.id;render()});select.className='name';const close=button('×',()=>closeTab(item.id));close.title='Close tab';tab.append(select,close);$('tabs').append(tab)});$('address').value=url||'';$('back').disabled=t.pos===0;$('forward').disabled=t.pos>=t.history.length-1;$('save').disabled=!url;$('save').textContent=url&&bookmarks.includes(url)?'★':'☆';$('content').replaceChildren(url?viewer(url):homeView())}
$('nav').addEventListener('submit',e=>{e.preventDefault();visit(resolveInput($('address').value))});$('back').onclick=()=>{const t=active();if(t.pos>0){t.pos--;render()}};$('forward').onclick=()=>{const t=active();if(t.pos<t.history.length-1){t.pos++;render()}};$('reload').onclick=render;$('home').onclick=()=>visit(null)||(()=>{const t=active();t.history=t.history.slice(0,t.pos+1);t.history.push(null);t.pos++;render()})();$('new').onclick=newTab;$('save').onclick=()=>{const url=urlOf(active());if(!url)return;bookmarks=bookmarks.includes(url)?bookmarks.filter(x=>x!==url):[...bookmarks,url];persist();render()};render();
</script></body></html>
